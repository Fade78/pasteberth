image: python:3.11-slim

stages:
  - test

tests:
  stage: test
  script:
    - python3 -m unittest discover -s tests -v

browser:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.0-noble
  parallel:
    matrix:
      - E2E_BROWSER: [chromium, firefox]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3
    - npm ci
  script:
    - echo "Running browser matrix for $E2E_BROWSER"
    - npm run test:e2e:all
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/e2e-junit.xml

# These jobs stay opt-in until native runners are registered. They prevent the
# platform contract from being forgotten without making Linux CI pending.
platform_windows:
  stage: test
  tags:
    - windows
  rules:
    - if: '$PASTEBERTH_NATIVE_WINDOWS_CI == "1"'
    - when: never
  script:
    - python -m unittest tests.test_platformfs

platform_macos:
  stage: test
  tags:
    - macos
  rules:
    - if: '$PASTEBERTH_NATIVE_MACOS_CI == "1"'
    - when: never
  script:
    - python3 -m unittest tests.test_platformfs

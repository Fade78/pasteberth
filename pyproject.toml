[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pasteberth"
version = "2.1.6"
description = "Clipboard-to-filesystem bridge for remote CLI/TUI harnesses (OpenCode and friends)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Pasteberth contributors" }]
# No runtime dependencies: standard library only.
dependencies = []

[project.scripts]
pasteberth = "PasteBerth.runtime.cli:main"

[tool.setuptools.packages.find]
include = ["PasteBerth*"]
namespaces = false

[tool.setuptools.package-data]
"PasteBerth" = ["support/*", "support/completions/*", "support/deploy/*"]
"PasteBerth.runtime" = ["static/*", "templates/*"]

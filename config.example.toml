# Configuration exemple de Pasteberth.
#
# Le fichier local recommandé est config.toml à la racine du dépôt.
#   (ou $PASTEBERTH_CONFIG, ou --config PATH)
#
# Le mot de passe n'est JAMAIS écrit ici : `pasteberth passwd` le hash
# (scrypt salé) dans un fichier « passwd » séparé, défini ci-dessous ou par défaut
# à côté de ce config.toml.

listen_address = "127.0.0.1"      # non-loopback : reverse proxy HTTPS recommandé
port = 8765
max_upload_size = "20MiB"         # 20 MiB par upload ; plafond absolu 50 MiB
max_image_pixels = 25000000        # 25 MP par défaut ; plafond absolu 50 MP

# Proxys autorisés à poser X-Forwarded-* (IP ou CIDR).
# Ne jamais y inclure des adresses joignables depuis Internet.
trusted_proxies = ["127.0.0.1", "::1"]

# Refus explicite du démarrage non-loopback sans auth, sauf si vous forcez :
allow_unauthenticated_local = false  # même derrière un reverse proxy
allow_unauthenticated_remote = false
allow_insecure_http_remote = false   # true uniquement sur un réseau privé maîtrisé

[tls]
enabled = false
# certificate = "/chemin/absolu/cert.pem"
# private_key = "/chemin/absolu/key.pem"

log_level = "INFO"                # DEBUG | INFO | WARNING | ERROR

[auth]
enabled = true                    # false seulement avec opt-in explicite ci-dessus
session_ttl_hours = 72            # durée de vie des sessions (serveur)
# password_file = "/chemin/absolu/vers/passwd"  # fichier régulier 0600

# ---------------------------------------------------------------- zone par défaut
# id : identifiant logique utilisé par l'API et l'UI ([a-z0-9_-])
# directory : chemin ABSOLU vu PAR LE SERVEUR (celui qu'utilise OpenCode)
# retain    : nombre d'images conservées par zone (rétention circulaire)
# reference_prefix : préfixe collé devant le chemin dans la référence
# color     : fond de la zone (#RRGGBB) ; meilleur contraste texte calculé auto
# create_directory : créer le répertoire s'il manque (défaut true)
# min_free_percent : espace libre minimal du filesystem avant upload (défaut 2 %)

[[zones]]
id = "default"
label = "Default"
type = "local"
# Le générateur remplace ce chemin par <depot>/storage/default.
directory = "/chemin/absolu/vers/pasteberth/storage/default"
retain = 10
reference_prefix = "@"
color = "#304237"
min_free_percent = 2.0

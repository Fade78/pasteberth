# Pasteberth example configuration.
#
# The recommended local file is config.toml at the repository root.
#   (or $PASTEBERTH_CONFIG, or --config PATH)
#
# The password is NEVER written here: `pasteberth passwd` stores a salted
# scrypt hash in a separate `passwd` file, configured below or next to config.toml.

listen_address = "127.0.0.1"      # non-loopback: HTTPS reverse proxy recommended
port = 8765
max_upload_size = "20MiB"         # 20 MiB per upload; absolute maximum 50 MiB
max_image_pixels = 25000000        # 25 MP default; absolute maximum 50 MP

# Proxies allowed to set X-Forwarded-* (IP or CIDR).
# Never include addresses reachable from the Internet.
trusted_proxies = ["127.0.0.1", "::1"]
# Public hostnames accepted in browser Origin/Referer checks; required for a
# non-loopback listener or a reverse proxy using a public hostname.
allowed_hosts = []

# Explicitly refuse non-loopback startup without authentication unless enabled:
allow_unauthenticated_local = false  # including behind a reverse proxy
allow_unauthenticated_remote = false
allow_insecure_http_remote = false   # true only on a controlled private network

log_level = "INFO"                # DEBUG | INFO | WARNING | ERROR

[tls]
enabled = false
# certificate = "/absolute/path/to/cert.pem"
# private_key = "/absolute/path/to/key.pem"

[auth]
enabled = true                    # false only with the explicit opt-in above
session_ttl_hours = 72            # server-side session lifetime
# password_file = "/absolute/path/to/passwd"  # regular 0600 file

# --------------------------------------------------------------- default zone
# id                : logical API/UI identifier ([a-z0-9_-])
# directory         : ABSOLUTE path as seen by the SERVER (used by OpenCode)
# retain            : number of images kept per zone (circular retention)
# reference_prefix  : text prepended to the returned reference (empty allowed)
# reference_suffix  : text appended to the returned reference (empty by default)
# color             : zone background (#RRGGBB); text contrast is calculated
# create_directory  : create the directory if missing (default true)
# min_free_percent  : minimum filesystem free space before upload (default 2 %)
# Group/other-writable modes are rejected; group/other-readable or executable
# modes produce an audit warning. Mode 0700 is recommended.

[[zones]]
id = "default"
label = "Default"
type = "local"
# The generator replaces this path with <repository>/storage/default.
directory = "/absolute/path/to/pasteberth/storage/default"
retain = 10
reference_prefix = "@"
reference_suffix = ""
color = "#304237"
min_free_percent = 2.0

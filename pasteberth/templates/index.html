<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Pasteberth</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1 class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 2a3 3 0 0 0-3 3H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2a3 3 0 0 0-3-3zm0 2a1 1 0 0 1 1 1v1h-2V5a1 1 0 0 1 1-1zM7 7h2.17c.41.59 1.04 1 1.83 1h2c.79 0 1.42-.41 1.83-1H17v13H7V7z"/>
    </svg>
    Pasteberth <span class="brand-version">v__PASTEBERTH_VERSION__</span>
  </h1>
  <div class="topbar-right">
    <span id="status" class="status" role="status"><span class="dot"></span><span id="status-text">connexion…</span></span>
    <form id="logout-form" action="/logout" method="post" hidden>
      <button class="ghost-btn" type="submit">Déconnexion</button>
    </form>
  </div>
</header>

<main id="grid" class="grid"></main>

<footer class="help">
  Raccourcis : <kbd>1</kbd>–<kbd>9</kbd> choisir une zone · <kbd>C</kbd> copier la référence sélectionnée · cliquer une miniature pour la sélectionner · glisser-déposer accepté directement sur une zone
</footer>

<div id="toast" class="toast" role="status" hidden></div>

<dialog id="pv" aria-label="Aperçu de l'image">
  <img id="pv-img" alt="aperçu agrandi">
  <div class="pv-bar">
    <code id="pv-ref" class="ref"></code>
    <div class="pv-actions">
      <button type="button" id="pv-copy" class="copy-btn">Copier la référence</button>
      <button type="button" id="pv-clear" class="clear-btn">Effacer</button>
      <button type="button" id="pv-close" class="ghost-btn">Fermer</button>
    </div>
  </div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>

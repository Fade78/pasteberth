# Pasteberth example configuration.
#
# The recommended local file is $XDG_CONFIG_HOME/pasteberth/config.toml
# (normally ~/.config/pasteberth/config.toml), or an explicit --config PATH.
# PASTEBERTH_CONFIG is also accepted. Keep the active file outside the
# read-only PasteBerth deployment.
#
# The password is NEVER written here: `pasteberth passwd` stores a salted
# scrypt hash in a separate `passwd` file, configured below or next to config.toml.

listen_address = "127.0.0.1"      # keep loopback when TLS terminates in a proxy
port = 8765
max_upload_size = "20MiB"         # set to "unlimited" for no application cap
max_image_pixels = 25000000        # set to "unlimited" to disable the pixel budget
# Empty for a root deployment, or e.g. "/paste" when mounted below a proxy path.
url_prefix = ""
# Display absolute file paths in the web UI; set false when paths are sensitive.
show_full_path = true

# Proxies allowed to set X-Forwarded-* (IP or CIDR).
# Never include addresses reachable from the Internet.
# Trust no forwarded headers by default; list only the actual reverse proxy IP.
# 127.0.0.1 trusts every local process that can connect to this listener.
trusted_proxies = []
# With authentication enabled, [] permits a hostname chosen by the deployment.
# Anonymous configurations must list controlled hostnames explicitly.
allowed_hosts = []

# Authentication and network safety are separate policies:
# loopback without auth requires allow_unauthenticated_local (also applies behind a proxy)
# non-loopback without auth requires allow_unauthenticated_remote
# non-loopback HTTP without TLS additionally requires allow_insecure_http_remote
allow_unauthenticated_local = false
allow_unauthenticated_remote = false
allow_insecure_http_remote = false   # true only on a controlled private network

# Accepted content kinds (all true by default; all false = refuse every upload).
# accept_img : structurally valid PNG, JPEG, or WebP images
# accept_doc : valid UTF-8 text without NUL bytes
# accept_bin : opaque binary content
accept_bin = true
accept_img = true
accept_doc = true

log_level = "INFO"                # DEBUG | INFO | WARNING | ERROR

# Operational budgets. Most values accept "unlimited"; request_queue_size is
# always a positive integer because it configures the OS listen backlog. These
# budgets are independent from max_upload_size.
[limits]
max_image_dimension = 16384
max_image_raw_size = "256MiB"
max_filename_length = 200
max_filename_size = 240
max_png_chunks = 100000
max_jpeg_segments = 100000
max_webp_chunks = 100000
max_mime_length = 120
max_multipart_boundary_length = 70
max_multipart_parts = 32
max_multipart_header_size = "8KiB"
max_multipart_field_name_length = 256
max_batch_names = 10000
max_batch_body_size = "2MiB"
max_comment_body_size = "8KiB"
max_http_header_size = "64KiB"
max_login_body_size = "4KiB"
max_login_fields = 8
max_login_delay_seconds = 900
max_login_concurrent_checks = 4
max_login_tracked_ips = 4096
login_forget_after_seconds = 3600
max_scrypt_memory_size = "64MiB"
max_password_file_size = "16KiB"
max_metadata_size = "64KiB"
max_comment_length = 280
max_comment_bytes = 1024
request_queue_size = 32
max_active_requests = 64
max_pending_requests = 8
http_header_timeout_seconds = 5
http_request_timeout_seconds = 60

[tls]
enabled = false
# certificate = "/absolute/path/to/cert.pem"
# private_key = "/absolute/path/to/key.pem"

[auth]
enabled = true                    # false only with the explicit opt-in above
session_ttl_hours = 72            # server-side session lifetime
max_sessions = 4096               # use "unlimited" to disable FIFO eviction
# password_file = "/absolute/path/to/passwd"  # regular 0600 file

# --------------------------------------------------------------- default zone
# id                : logical API/UI identifier (first [a-z0-9], then [a-z0-9_-], max 64)
# directory         : ABSOLUTE path as seen by the SERVER; used by the harness
#                      and as the target path for filesystem operations
# retain            : number of stored contents kept per zone (oldest removed first)
# reference_prefix  : text prepended to the returned reference (empty allowed)
# reference_suffix  : text appended to the returned reference (empty by default)
# reference_list_prefix/suffix : delimit a copied list of references (empty default)
# reference_separator : text between references in a copied list (default ",")
# allow_zip_download : allow downloading selected contents as a ZIP (default true)
# color             : zone background (#RRGGBB); text contrast is calculated
# create_directory  : create the directory if missing (default true)
# min_free_percent  : minimum filesystem free space before upload (default 2 %)
# file_group        : optional POSIX group name or numeric GID for created files
# Legacy storage_mode = "directory" and max_items values are normalized to sidecar.
# Non-private modes produce an audit warning but do not prevent startup.
# Mode 0700 is recommended.

[[zones]]
id = "default"
label = "Default"
type = "local"
# The generator replaces this path with the external XDG data directory.
directory = "/absolute/path/to/pasteberth-data/storage/default"
retain = 10
reference_prefix = "@"
reference_suffix = ""
reference_list_prefix = ""
reference_list_suffix = ""
reference_separator = ","
allow_zip_download = true
color = "#304237"
min_free_percent = 2.0
# file_group = "pasteberth"

# ----------------------------------------------------------- dynamic zones
# Discovery follows existing directories only and never creates candidates.
# [[autozone]]
# base_directory = "/home/me/Depots"
# pattern = "^[^/]+/work/exchange$"
# max_depth = 4
# group = "Repositories"
# label_mode = "git-or-relative"
# retain = 10
# file_group = "pasteberth"
# min_free_percent = 2.0
# group_layout = "tab"
# group_hide_empty = false
# group_show_count = true

# --------------------------------------------------------------- zone groups
# A group selects zones and controls their layout. A zone can belong to several
# groups. If no [[groups]] section is present, an implicit "All" group exists
# but is not shown in the UI.
#
# name        : display name in the UI
# selection   : all, pattern, or other (default: pattern)
# pattern     : Python regular expressions for selection = "pattern"
#               (re.search semantics, case-sensitive; use ^ and $ to anchor)
# layout      : area or tab (default: area)
# hide_empty  : hide the group tab when no zones match (default: false)
# show_count  : show zone count as "(N)" in the group tab (default: true)
#
[[groups]]
name = "All"
selection = "all"
layout = "area"
hide_empty = false
show_count = true
